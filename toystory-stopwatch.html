<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>앤디의 방 스탑워치</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(#4a9be8 73.7%, #a8723f 73.7%);
    overflow: hidden;
  }
  #scene { display: block; width: 100vw; height: 100vh; user-select: none; -webkit-user-select: none; }
  text { font-family: "Segoe UI", "Malgun Gothic", sans-serif; }
  .mono { font-family: Consolas, "Courier New", monospace; }
  .crayon { font-family: "Segoe Print", "Comic Sans MS", "Malgun Gothic", cursive; }

  .btn { cursor: pointer; outline: none; }
  .btn .cap { transition: transform .08s, filter .15s; }
  .btn:hover .cap { filter: brightness(1.15); }
  .btn:active .cap { transform: translateY(4px); filter: brightness(.85); }
  .btn:focus-visible .ring-focus { stroke: #fff; stroke-width: 3; }
  .ring-focus { fill: none; stroke: none; }

  .knob-spin { transform-box: fill-box; transform-origin: center; }
  #scene.running .knob-spin { animation: spin 1.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #ringGroup { transition: transform .15s; }
  #bubble { opacity: 0; transition: opacity .2s; pointer-events: none; }
  #bubble.show { opacity: 1; }
  #screenGlow { animation: none; }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid meet" role="img" aria-label="앤디의 방 스탑워치">
<defs>
  <!-- 그림자 -->
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">

  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".35"/>

    <g fill="#fff" opacity=".92" transform="translate(110 85) scale(.85)">

  <linearGradient id="wallShade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".12"/>
  </linearGradient>
  <!-- 마룻바닥 -->
  <pattern id="floorPat" width="240" height="120" patternUnits="userSpaceOnUse">

    <path d="M0 0H240M0 60H240M0 120H240M70 0V60M190 60V120" stroke="#9d6733" stroke-width="3" fill="none"/>

  <!-- 공통 질감 -->

  <radialGradient id="gVest" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#fffdf5"/><stop offset="1" stop-color="#d9d2bd"/></radialGradient>

<g id="paper" transform="rotate(-3 165 120)" filter="url(#softShadow)">
  <rect x="45" y="22" width="240" height="196" rx="4" fill="#fffdf1"/>
  <g stroke="#a8c8f0" stroke-width="1.5" opacity=".8">
    <path d="M45 88H285M45 114H285M45 140H285M45 166H285M45 192H285"/>

  <rect x="200" y="10" width="46" height="20" fill="#ffe27a" opacity=".85" transform="rotate(5 223 20)"/>
  <text class="crayon" x="96" y="70" font-size="36" font-weight="800" fill="#e0382f" transform="rotate(-2 96 70)">ANDY</text>
  <text id="lapHint" class="crayon" x="94" y="112" font-size="17" fill="#8a96a8">랩 버튼을 눌러봐!</text>
  <g class="crayon" font-size="19" font-weight="700" fill="#2a50a0">
    <text id="lap0" x="92" y="108"></text>

<!-- 말풍선 -->
<g id="bubble">
  <polygon id="bTail" points="0,0 0,0 0,0" fill="#fff" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
  <rect id="bRect" x="0" y="0" width="100" height="46" rx="22" fill="#fff" stroke="#222" stroke-width="3"/>
  <line id="bSeam" stroke="#fff" stroke-width="5"/>
  <text id="bText" font-size="20" font-weight="800" fill="#222" text-anchor="middle"></text>
</g>
</svg>

<script>
  const $ = id => document.getElementById(id);

  /* ---------- ABC 블록 ---------- */
  function cube(tf, c, l, d, ch) {
    return `<g transform="${tf}">
      <polygon points="0,-56 14,-70 70,-70 56,-56" fill="${l}"/>
      <polygon points="56,-56 70,-70 70,-14 56,0" fill="${d}"/>
      <rect x="0" y="-56" width="56" height="56" rx="4" fill="${c}"/>
      <text x="28" y="-16" font-size="36" font-weight="800" text-anchor="middle" fill="#fff" font-family="Arial Black, Arial">${ch}</text>
    </g>`;
  }
  $('blocks').innerHTML =
    cube('translate(525 700)', '#e0382f', '#f2736b', '#a8231b', 'A') +
    cube('translate(595 700)', '#2a6fd6', '#6a9fe8', '#1c4a96', 'B') +
    cube('translate(525 644) rotate(-6 28 0)', '#f0b81a', '#f8d764', '#b88608', 'C');

  /* ---------- 스톱워치 ---------- */
  let running = false, startTime = 0, elapsed = 0, lapStart = 0, laps = [], rafId = null;
  const total = () => elapsed + (running ? performance.now() - startTime : 0);

  function format(ms) {
    const pad = n => String(n).padStart(2, '0');
    const cs = Math.floor(ms / 10) % 100, s = Math.floor(ms / 1000) % 60;
    const m = Math.floor(ms / 60000) % 60, h = Math.floor(ms / 3600000);
    return (h ? h + ':' : '') + pad(m) + ':' + pad(s) + '.' + pad(cs);
  }
  function render() {
    const t = format(total());
    const el = $('disp');
    el.textContent = t;
    el.setAttribute('font-size', t.length > 8 ? 70 : 96);
  }
  function tick() { render(); rafId = requestAnimationFrame(tick); }
  function setStatus() {
    $('status').textContent = running ? 'RUNNING' : (elapsed > 0 ? 'PAUSED' : 'READY');
    $('scene').classList.toggle('running', running);
  }
  function renderLaps() {
    const rows = laps.slice(-5).reverse();
    for (let i = 0; i < 5; i++) {
      $('lap' + i).textContent = rows[i] !== undefined ? `랩 ${laps.length - i}   ${format(rows[i])}` : '';
    }
    $('lapHint').style.display = laps.length ? 'none' : '';
  }

  /* ---------- 말풍선 ---------- */
  const anchors = { buzz: [1030, 262], woody: [170, 255], rex: [410, 420], hamm: [810, 568] };
  let bubbleTimer = null;
  function say(who, text) {
    const [ax, ay] = anchors[who];
    const t = $('bText');
    t.textContent = text;
    const w = Math.ceil(t.getComputedTextLength()) + 44, h = 46;
    const bx = Math.max(12, Math.min(ax - w / 2, 1188 - w)), by = ay - 82;
    $('bRect').setAttribute('x', bx); $('bRect').setAttribute('y', by);
    $('bRect').setAttribute('width', w); $('bRect').setAttribute('height', h);
    t.setAttribute('x', bx + w / 2); t.setAttribute('y', by + 30);
    const tx = Math.max(bx + 28, Math.min(ax, bx + w - 28));
    $('bTail').setAttribute('points', `${tx - 10},${by + h - 2} ${tx + 10},${by + h - 2} ${ax},${ay - 6}`);
    const seam = $('bSeam');
    seam.setAttribute('x1', tx - 8); seam.setAttribute('x2', tx + 8);
    seam.setAttribute('y1', by + h); seam.setAttribute('y2', by + h);
    $('bubble').classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => $('bubble').classList.remove('show'), 1800);
  }

  /* ---------- 동작 ---------- */
  function start() {
    if (running) return;
    startTime = performance.now(); running = true;
    rafId = requestAnimationFrame(tick);
    setStatus(); say('buzz', '무한한 공간 저 너머로!');
  }
  function stop() {
    if (!running) return;
    elapsed += performance.now() - startTime; running = false;
    cancelAnimationFrame(rafId); render();
    setStatus(); say('hamm', '잠깐 쉬자고~');
  }
  function lap() {
    if (!running) return;
    const t = total();
    laps.push(t - lapStart); lapStart = t;
    renderLaps(); say('rex', '으악! 벌써 랩이야?!');
  }
  function reset() {
    $('ringGroup').style.transform = 'translateY(30px)';
    $('cord').setAttribute('y2', -184);
    setTimeout(() => { $('ringGroup').style.transform = ''; $('cord').setAttribute('y2', -214); }, 220);
    if (running) { running = false; cancelAnimationFrame(rafId); }
    elapsed = 0; lapStart = 0; laps = [];
    render(); renderLaps(); setStatus(); say('woody', '카우보이 출동!');
  }

  $('btnStart').addEventListener('click', start);
  $('btnStop').addEventListener('click', stop);
  $('btnLap').addEventListener('click', lap);
  $('btnReset').addEventListener('click', reset);
  document.querySelectorAll('.btn').forEach(b => b.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); b.dispatchEvent(new MouseEvent('click')); }
  }));
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); running ? stop() : start(); }
    else if (e.key === 'l' || e.key === 'L') lap();
    else if (e.key === 'r' || e.key === 'R') reset();
  });

  render(); renderLaps(); setStatus();
</script>
</body>
</html>
